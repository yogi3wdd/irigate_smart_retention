name: irigate_smart_retention
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  animated_text_kit: ^4.3.0
  cloud_firestore: ^6.1.0
  cupertino_icons: ^1.0.8
  firebase_auth: ^6.1.2
  firebase_core: ^4.2.1
  firebase_database: ^12.1.0
  fl_chart: ^1.1.1
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  google_fonts: ^6.3.3
  hugeicons: ^1.1.2
  liquid_glass_renderer: ^0.2.0-dev.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21